<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonninyira Admin Control Tower</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1c1410;--card:#2a1f19;--card2:#33261c;--red:#e23f25;--gold:#f5b400;--green:#4c9a5b;--sand:#f3e8d8;--muted:#9c897a;--line:rgba(243,232,216,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--sand);font:14px/1.6 'Work Sans',sans-serif}.display{font-family:'Alfa Slab One',serif;font-weight:400;font-synthesis:none}.top{position:sticky;top:0;z-index:20;background:rgba(28,20,16,.98);border-bottom:1px solid var(--line)}.top-in{max-width:1450px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px}.eyebrow{font-size:9px;letter-spacing:1.5px;color:var(--gold);font-weight:900}.brand h1{margin:2px 0 0;font-size:18px}.session{display:flex;gap:10px;align-items:center}.who{font-size:11px;color:#9de1a8;font-weight:800}.top-link,.signout,.refresh,.nav{font:800 11px 'Work Sans',sans-serif;cursor:pointer}.top-link,.signout{padding:7px 10px;border-radius:8px;text-decoration:none}.top-link{border:1px solid var(--line);color:var(--gold);background:transparent}.signout{border:1px solid rgba(226,63,37,.45);color:#ffb0a5;background:transparent}.layout{max-width:1450px;margin:auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;padding:14px}.rail{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;height:calc(100vh - 104px);min-height:620px;position:sticky;top:90px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.12)}.rail-title{padding:8px 10px 9px;color:var(--gold);font-size:9px;letter-spacing:1.3px;font-weight:900}.nav{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;color:var(--muted);padding:12px 12px;border-radius:10px;min-height:44px;transition:background .15s ease,color .15s ease,transform .15s ease}.nav:hover,.nav.active{background:var(--card2);color:var(--sand)}.nav.active{box-shadow:inset 3px 0 0 var(--gold)}.nav:hover{transform:translateX(2px)}.nav-icon{width:22px;height:22px;display:grid;place-items:center;flex:0 0 22px;color:currentColor}.nav-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-label{flex:1}.divider{height:1px;background:var(--line);margin:8px 4px}.main{min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}.head h2{margin:0;font-size:24px}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}.refresh{padding:8px 11px;border:1px solid rgba(245,180,0,.25);background:rgba(245,180,0,.08);color:var(--gold);border-radius:8px}.status{margin-bottom:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px}.status.error{border-color:rgba(226,63,37,.3);background:rgba(226,63,37,.08);color:#ffb0a5}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px;font-weight:900}.metric strong{display:block;margin-top:4px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;overflow:auto}.panel h3{margin:0 0 8px;font-size:13px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:top}th{background:var(--card2);color:var(--gold);font-size:9px;text-transform:uppercase}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:var(--card2);color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.ok{background:rgba(76,154,91,.14);color:#9de1a8}.warn{background:rgba(245,180,0,.12);color:#ffd86d}.bad{background:rgba(226,63,37,.12);color:#ff9d8e}.empty{padding:30px;text-align:center;color:var(--muted)}.error-box{padding:15px;border-radius:12px;border:1px solid rgba(226,63,37,.25);background:rgba(226,63,37,.08);color:#ffb0a5}.mobile-nav{display:none}
.muted{color:var(--muted)}.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}.tbl-search{flex:1 1 180px;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--ink);color:var(--sand);font:inherit;font-size:12px}.tbl-status{padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--ink);color:var(--sand);font:inherit;font-size:12px}.tbl-csv{padding:8px 11px;border-radius:9px;border:1px solid rgba(245,180,0,.3);background:rgba(245,180,0,.08);color:var(--gold);font:800 11px 'Work Sans',sans-serif;cursor:pointer}.tbl-count{font-size:10px;color:var(--muted)}.tbl-wrap{overflow:auto}.acts{display:flex;flex-wrap:wrap;gap:5px}.act{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:800 10.5px 'Work Sans',sans-serif;cursor:pointer;background:var(--card2);color:var(--sand);white-space:nowrap}.act.go{background:#4C9A5B;border-color:#4C9A5B;color:#fff}.act.warn{background:rgba(245,180,0,.14);border-color:rgba(245,180,0,.4);color:#ffd86d}.act.stop{background:rgba(226,63,37,.14);border-color:rgba(226,63,37,.45);color:#ffb0a5}.act:disabled{opacity:.5;cursor:wait}.dlg-back{position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}.dlg{background:var(--card);color:var(--sand);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:20px;width:min(480px,100%)}.dlg h3{margin:0 0 6px;font-size:1.05rem}.dlg p{margin:0 0 12px;font-size:.82rem;color:var(--muted);line-height:1.5}.dlg-l{display:block;font-size:11px;font-weight:800;margin:10px 0 5px}.dlg-in{width:100%;padding:10px;border-radius:9px;background:var(--ink);color:var(--sand);border:1px solid rgba(255,255,255,.2);font:inherit;font-size:13px}.dlg-err{min-height:18px;color:#ffb0a5;font-size:11px;margin-top:6px}.dlg-row{display:flex;gap:8px;margin-top:8px}.dlg-row button{flex:1;border-radius:9px;padding:10px;font-weight:800;cursor:pointer;font-family:inherit}.dlg-no{border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit}.dlg-ok{border:0;background:#4C9A5B;color:#fff}.dlg-ok.danger{background:var(--red)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.rail{position:static;height:auto;min-height:0;display:flex;flex-wrap:wrap;gap:4px}.rail-title,.divider{display:none}.nav{width:auto;white-space:nowrap}.nav-icon{width:20px;flex-basis:20px}.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.top-in{padding:10px}.session .who{display:none}.layout{padding:9px}.mobile-nav{display:block}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{align-items:flex-start}.rail{border-radius:12px;padding:8px}.nav{padding:10px 9px;min-height:42px;gap:8px}.nav-label{font-size:10px}}
</style>
<script src="media-uploader.js"></script>
<script src="case-thread.js"></script>
<script src="admin-session-fix.js"></script>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand"><img src="assets/tonninyira-mark.svg" alt="Tonninyira"><div><div class="eyebrow">ADMIN CONTROL TOWER</div><h1 class="display">TONNINYIRA COMMAND CENTRE</h1></div></div><div class="session"><span class="who" id="who">Checking access…</span><a class="top-link" href="admin-user-guide.html">User Guide</a><button class="signout" id="signout" type="button">Sign out</button></div></div></header>
<div class="layout" id="page">
<aside class="rail" id="nav"></aside>
<main class="main">
<div class="head"><div><h2 class="display" id="title">Overview</h2><p id="subtitle">Live marketplace operating picture.</p></div><button class="refresh" id="refresh" type="button">Refresh</button></div>
<div class="status" id="status">Loading command centre…</div>
<div id="app"><div class="empty">Preparing marketplace data…</div></div>
</main>
</div>
<script>
(function(){
  'use strict';
  const NAV=[
    ['Overview','overview','dashboard'],
    ['Operations','operations','orders'],
    ['Customers','customers','users'],
    ['Vendors & riders','partners','partners'],
    ['Payments & payouts','finance','payments'],
    ['Support','support','support'],
    ['Approvals & trust','trust','shield'],
    ['Growth & analytics','growth','chart'],
    ['System data','system','database']
  ];
  const ICONS={
    dashboard:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>',
    orders:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"></path><path d="M9 7h6M9 11h6M9 15h4"></path><path d="M4 7h2M18 7h2"></path></svg>',
    users:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19a5.5 5.5 0 0 1 11 0"></path><circle cx="17" cy="9" r="2.2"></circle><path d="M15 15.5a4.2 4.2 0 0 1 5.5 3.5"></path></svg>',
    partners:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v11H4z"></path><path d="M7 7V5h10v2M8 12h8M12 10v4"></path></svg>',
    payments:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M7 14h4"></path></svg>',
    support:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5"></path></svg>',
    shield:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v5c0 5-3.2 8-8 10-4.8-2-8-5-8-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>',
    chart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"></path><path d="M7 15l4-4 3 2 5-6"></path></svg>',
    database:'<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"></ellipse><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"></path></svg>'
  };
  const client=()=>window.tnAdminClient?.();
  const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const money=v=>new Intl.NumberFormat('en-UG').format(Math.round(Number(v||0)))+' UGX';
  const when=v=>v?String(v).replace('T',' ').slice(0,16):'—';
  const pill=v=>{const s=String(v??'—'),k=s.toLowerCase();let c='';if(['approved','paid','completed','success','successful','ready','active'].includes(k))c='ok';else if(['pending','requested','processing','accepted','new','preparing','awaiting payment'].includes(k))c='warn';else if(['failed','cancelled','rejected','suspended','removed','declined'].includes(k))c='bad';return '<span class="pill '+c+'">'+esc(s)+'</span>'};
  const phoneKey=p=>String(p||'').replace(/\D/g,'').slice(-9);
  const app=document.getElementById('app'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),status=document.getElementById('status'),who=document.getElementById('who');
  let current=new URLSearchParams(location.search).get('view')||'overview';
  const nav=document.getElementById('nav');
  nav.innerHTML='<div class="rail-title">WORKSPACE</div>'+NAV.map(([label,key,icon])=>'<button type="button" class="nav '+(key===current?'active':'')+'" data-view="'+key+'" aria-label="'+esc(label)+'"><span class="nav-icon" aria-hidden="true">'+ICONS[icon]+'</span><span class="nav-label">'+esc(label)+'</span></button>').join('');
  nav.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.view;history.replaceState(null,'','?view='+encodeURIComponent(current));nav.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));load(current)}));
  function setHead(t,s){title.textContent=t;subtitle.textContent=s}
  function note(msg,isError){status.className='status'+(isError?' error':'');status.textContent=msg}

  /* Every table is searchable, filterable by status and exportable. Rows and
     column definitions are kept per table so filtering re-renders only the body. */
  const TABLES={};let tableSeq=0;
  function cellText(c,r){if(c.csv)return String(c.csv(r)??'');if(c.key)return String(r[c.key]??'');const d=document.createElement('div');d.innerHTML=c.render?c.render(r):'';return d.textContent.trim()}
  function bodyRows(t){
    const q=t.q.trim().toLowerCase();
    const rows=t.rows.filter(r=>(!t.statusVal||String(t.statusOf(r)).toLowerCase()===t.statusVal)&&(!q||t.cols.some(c=>!c.noSearch&&cellText(c,r).toLowerCase().includes(q))));
    t.visible=rows;
    return rows.length?rows.map(r=>'<tr>'+t.cols.map(c=>'<td>'+(c.render?c.render(r):esc(r[c.key]))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+t.cols.length+'" class="empty">No matching records.</td></tr>';
  }
  function table(rows,cols,opts={}){
    if(!rows.length)return '<div class="empty">No records found.</div>';
    const ai=cols.findIndex(c=>c.label==='Actions'||c.label==='Decision');
    if(ai>1&&innerWidth<650){cols=cols.slice();cols.splice(1,0,cols.splice(ai,1)[0])}
    const id='t'+(++tableSeq);
    const statusOf=opts.status||null;
    TABLES[id]={rows,cols,q:'',statusVal:'',statusOf,name:opts.name||'records',visible:rows};
    const statuses=statusOf?[...new Set(rows.map(r=>String(statusOf(r)||'—').toLowerCase()))].sort():[];
    return '<div class="tbl-tools" data-tid="'+id+'"><input class="tbl-search" type="search" placeholder="Search…" aria-label="Search this table">'
      +(statusOf?'<select class="tbl-status" aria-label="Filter by status"><option value="">All statuses</option>'+statuses.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('')+'</select>':'')
      +'<button type="button" class="tbl-csv">Export CSV</button><span class="tbl-count">'+rows.length+' rows</span></div>'
      +'<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody id="'+id+'">'+bodyRows(TABLES[id])+'</tbody></table></div>';
  }
  function refreshTable(id){const t=TABLES[id];const tb=document.getElementById(id);if(!t||!tb)return;tb.innerHTML=bodyRows(t);const cnt=app.querySelector('.tbl-tools[data-tid="'+id+'"] .tbl-count');if(cnt)cnt.textContent=t.visible.length+' of '+t.rows.length+' rows'}
  app.addEventListener('input',e=>{const box=e.target.closest('.tbl-tools');if(!box)return;const t=TABLES[box.dataset.tid];if(!t)return;if(e.target.classList.contains('tbl-search'))t.q=e.target.value;refreshTable(box.dataset.tid)});
  app.addEventListener('change',e=>{const box=e.target.closest('.tbl-tools');if(!box||!e.target.classList.contains('tbl-status'))return;const t=TABLES[box.dataset.tid];t.statusVal=e.target.value;refreshTable(box.dataset.tid)});
  app.addEventListener('click',e=>{
    const b=e.target.closest('.tbl-csv');if(!b)return;const t=TABLES[b.closest('.tbl-tools').dataset.tid];if(!t)return;
    const cols=t.cols.filter(c=>!c.noCsv);
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const csv=[cols.map(c=>q(c.label)).join(',')].concat(t.visible.map(r=>cols.map(c=>q(cellText(c,r))).join(','))).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download='tonninyira-'+t.name+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  });

  async function rows(tableName,columns='*',limit=1000){const r=await client().from(tableName).select(columns).limit(limit);if(r.error)throw r.error;return r.data||[]}

  /* A confirmation step for every action, with the reason (and any extra
     detail) captured so it lands in the audit log. */
  function ask({title:t,message,fields=[],confirm='Confirm',danger=false}){
    return new Promise(resolve=>{
      const m=document.createElement('div');m.className='dlg-back';
      m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="'+esc(t)+'"><h3>'+esc(t)+'</h3>'+(message?'<p>'+esc(message)+'</p>':'')
        +fields.map((f,i)=>'<label class="dlg-l" for="dlgf'+i+'">'+esc(f.label)+(f.required?' *':'')+'</label>'
          +(f.type==='select'?'<select id="dlgf'+i+'" class="dlg-in">'+f.options.map(o=>'<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>').join('')+'</select>'
           :f.type==='textarea'?'<textarea id="dlgf'+i+'" class="dlg-in" rows="3" maxlength="500"></textarea>'
           :'<input id="dlgf'+i+'" class="dlg-in" maxlength="200">')).join('')
        +'<div class="dlg-err" id="dlgErr"></div><div class="dlg-row"><button type="button" class="dlg-no">Cancel</button><button type="button" class="dlg-ok'+(danger?' danger':'')+'">'+esc(confirm)+'</button></div></div>';
      document.body.appendChild(m);
      const done=v=>{m.remove();resolve(v)};
      m.querySelector('.dlg-no').onclick=()=>done(null);
      m.onclick=e=>{if(e.target===m)done(null)};
      m.querySelector('.dlg-ok').onclick=()=>{
        const vals={};
        for(let i=0;i<fields.length;i++){const v=m.querySelector('#dlgf'+i).value.trim();if(fields[i].required&&!v){m.querySelector('#dlgErr').textContent=fields[i].label+' is required.';return}vals[fields[i].name]=v}
        done(vals);
      };
      m.querySelector('.dlg-in')?.focus();
    });
  }
  const reasonField={name:'reason',label:'Reason (kept in the audit log)',type:'textarea',required:true};
  async function rpc(fn,args){const r=await client().rpc(fn,args);if(r.error)throw r.error;return r.data}

  const btn=(act,label,data,kind)=>'<button type="button" class="act'+(kind?' '+kind:'')+'" data-act="'+act+'" '+Object.entries(data).map(([k,v])=>'data-'+k+'="'+esc(v)+'"').join(' ')+'>'+esc(label)+'</button>';

  function partnerActions(kind,row){
    const s=String(row.approval_status||'pending').toLowerCase(),d={kind,id:row.tonninyira_id};
    if(s==='removed')return '<span class="muted">Removed</span>';
    let h='';
    if(['pending','rejected','suspended'].includes(s))h+=btn('p-approve',s==='suspended'?'Reactivate':'Approve',d,'go');
    if(s==='pending')h+=btn('p-reject','Reject',d,'stop');
    if(s==='approved')h+=btn('p-suspend','Suspend',d,'warn');
    if(kind==='vendor')h+=btn('p-media','Media',d,'');
    h+=btn('p-link',row.auth_user_id?'Relink':'Link account',d,'');
    h+=btn('p-remove','Remove',d,'stop');
    return '<div class="acts">'+h+'</div>';
  }
  function duplicateFlags(list,keys){
    const counts={};const live=list.filter(r=>!['removed','rejected'].includes(String(r.approval_status).toLowerCase()));
    live.forEach(r=>keys.forEach(k=>{const v=k(r);if(v)counts[v]=(counts[v]||0)+1}));
    return r=>!['removed','rejected'].includes(String(r.approval_status).toLowerCase())&&keys.some(k=>{const v=k(r);return v&&counts[v]>1});
  }
  const vendorKeys=[r=>phoneKey(r.phone)&&'p'+phoneKey(r.phone),r=>r.business_name&&'n'+String(r.business_name).trim().toLowerCase()];
  const riderKeys=[r=>phoneKey(r.phone)&&'p'+phoneKey(r.phone),r=>r.plate_number&&'l'+String(r.plate_number).replace(/\s/g,'').toLowerCase()];

  async function overview(){setHead('Overview','Live marketplace operating picture.');const [o,p,v,r,pay,po,e]=await Promise.all([rows('orders'),rows('profiles','id,role,created_at,suspended_at'),rows('vendors'),rows('riders'),rows('payment_transactions'),rows('partner_payouts'),rows('market_events')]);
    const paid=o.filter(x=>x.payment_status==='paid'),gmv=paid.reduce((a,x)=>a+Number(x.total||0),0),fees=paid.reduce((a,x)=>a+Number(x.platform_fee||0)+Number(x.rider_platform_fee||0),0),done=o.filter(x=>String(x.status).toLowerCase()==='completed').length,openPay=pay.filter(x=>['pending','failed'].includes(String(x.status).toLowerCase())).length,pending=v.filter(x=>x.approval_status==='pending').length+r.filter(x=>x.approval_status==='pending').length,requested=po.filter(x=>['requested','approved','processing'].includes(x.status)).length,unassigned=new Set(o.filter(x=>x.payment_status==='paid'&&!x.rider_tid&&['pending','new'].includes(x.status)).map(x=>x.order_id)).size;
    const dupV=duplicateFlags(v,vendorKeys),dupR=duplicateFlags(r,riderKeys),dups=v.filter(dupV).length+r.filter(dupR).length;

  /* Reading messages is not support. Without a way to answer, every customer who
     writes in is met with silence -- so each conversation carries a reply box.
     support_messages_insert already permits staff to post into an open one. */
  /* Support = cases. An order complaint (case_ref, category, photos) or a
     general chat. Support can reply with photos, add support-only notes, and
     move a case through open -> investigating -> waiting for customer ->
     resolved -> closed via admin_set_case_status (audited). The conversation
     UI and private evidence photos come from case-thread.js / media-uploader.js. */
  let caseOpen=null, caseFilter='active', caseCtx=null;
  const CASE_ACTIVE=['open','investigating','awaiting_customer'];
  const hoursSince=v=>v?Math.floor((Date.now()-new Date(v).getTime())/3600000):0;
  async function support(){

    const waiting=x=>CASE_ACTIVE.includes(x.status)&&x.last_sender_role!=='support';
    const groups={active:c.filter(x=>CASE_ACTIVE.includes(x.status)),done:c.filter(x=>['resolved','closed'].includes(x.status))};
    const list=groups[caseFilter]||groups.active;
    const tab=(k,l,n)=>'<button type="button" class="act'+(caseFilter===k?' go':'')+'" data-case-filter="'+k+'">'+l+' ('+n+')</button>';
    const cats={not_delivered:'Not delivered',damaged:'Arrived damaged',wrong_item:'Wrong item',missing_item:'Something missing',late:'Very late',rider_conduct:'Rider behaviour',stall_conduct:'Stall behaviour',other:'Something else'};

      +(list.length?list.map(x=>{const h=hoursSince(x.last_message_at||x.created_at),late=waiting(x)&&h>=24;
        return '<button type="button" data-case-open="'+esc(x.id)+'" style="display:flex;gap:12px;width:100%;text-align:left;padding:12px;margin-top:8px;border-radius:12px;cursor:pointer;font:inherit;color:inherit;background:var(--card2);border:1px solid '+(late?'rgba(226,63,37,.6)':'var(--line)')+'">'
          +'<span style="flex:1;min-width:0"><b>'+esc(x.case_ref||'General chat')+'</b> · '+esc(x.order_id?cats[x.category]||'Complaint':'Chat')+(x.order_id?' · '+esc(x.order_id):'')
          +'<br><span class="muted" style="font-size:11px">'+esc(who(x.customer_id))+' · last message '+esc(when(x.last_message_at||x.created_at))
          +(waiting(x)?' · <b style="color:'+(late?'#ff9d8e':'#ffd86d')+'">waiting on support '+h+' h</b>':'')+(x.refund_due?' · <b style="color:#ffd86d">refund due</b>':'')+'</span></span>'

      client().from('profiles').select('display_name,phone').eq('id',cs.customer_id).maybeSingle().then(r=>r.data),

        +'<p style="margin:4px 0"><b>Paid:</b> '+money(total)+' · '+pill(orders[0]?.payment_status||'—')+'</p>'

  app.addEventListener('click',async e=>{
    const f=e.target.closest('[data-case-filter]');if(f){caseFilter=f.dataset.caseFilter;return load('support')}
    const o=e.target.closest('[data-case-open]');if(o){caseOpen=o.dataset.caseOpen;return load('support')}
    if(e.target.closest('[data-case-back]')){caseOpen=null;return load('support')}
    const s=e.target.closest('[data-case-status]');if(!s||!caseOpen)return;
    const st=s.dataset.caseStatus,final=['resolved','closed'].includes(st);
    if(st==='resolved'&&caseCtx?.cs?.order_id) return resolveWithMoney();
    const v=await ask({title:{investigating:'Mark as investigating',awaiting_customer:'Ask the customer for more information',resolved:'Resolve this case',closed:'Close this case',open:'Reopen this case'}[st],
      message:final?'The customer, stall and rider will see your decision. Mark a refund as due if the customer should get money back.':'The customer is notified of the change.',
      fields:(final?[{name:'resolution',label:'Decision (shown to the customer)',type:'textarea',required:true},{name:'refund',label:'Refund due?',type:'select',options:[{value:'no',label:'No refund'},{value:'yes',label:'Yes — refund the customer'}]}]:
        st==='awaiting_customer'?[{name:'resolution',label:'What do you need from them? (shown to the customer)',type:'textarea',required:true}]:[]).concat([{name:'reason',label:'Internal reason (audit log)',type:'textarea',required:true}]),
      confirm:'Save',danger:st==='closed'});
    if(!v)return;
    try{await rpc('admin_set_case_status',{p_conversation:caseOpen,p_status:st,p_resolution:v.resolution||null,p_refund_due:final?v.refund==='yes':null,p_reason:v.reason});note('Case updated.');load('support')}
    catch(err){note('Could not update the case: '+String(err?.message||err),true)}
  });

  /* Resolving an order complaint decides the money, through the audited
     admin_resolve_case_money(): release the held payment to the stall, refund
     part of it (taken from the stall's share), refund everything because the
     stall was at fault (the stall also covers the delivery fee so the rider is
     still paid), or refund everything as Tonninyira goodwill (stall and rider
     keep their pay). Refunds are queued in order_refunds. */
  async function resolveWithMoney(){
    const {cs,orders}=caseCtx;
    const stalls=[...new Map(orders.map(o=>[o.vendor_id,o])).values()];
    const fields=[{name:'outcome',label:'Outcome',type:'select',options:[
        {value:'release',label:'No refund — release the payment to the stall'},
        {value:'partial_refund',label:'Partial refund — taken from the stall\'s share'},
        {value:'full_refund_stall',label:'Full refund — stall\'s fault (stall also covers delivery)'},
        {value:'full_refund_platform',label:'Full refund — Tonninyira covers it (goodwill)'}]}];
    if(stalls.length>1) fields.push({name:'vendor',label:'Which stall?',type:'select',options:[{value:'',label:cs.vendor_id?'The stall named in the complaint':'Choose a stall…'}].concat(stalls.map(o=>({value:o.vendor_id,label:o.vendor_name||o.vendor_id})))});
    fields.push({name:'amount',label:'Refund amount in UGX (partial refunds only)'},
      {name:'resolution',label:'Decision (shown to the customer)',type:'textarea',required:true},
      {name:'reason',label:'Internal reason (audit log)',type:'textarea',required:true});
    const v=await ask({title:'Resolve this case',message:'Decide what happens to the money. The customer, stall and rider will see your decision.',fields,confirm:'Resolve'});
    if(!v)return;
    const amount=Number(String(v.amount||'').replace(/[^\d.]/g,''));
    if(v.outcome==='partial_refund'&&!(amount>0))return note('Enter the refund amount for a partial refund.',true);
    try{
      const r=await rpc('admin_resolve_case_money',{p_conversation:cs.id,p_outcome:v.outcome,p_vendor_id:v.vendor||null,p_amount:v.outcome==='partial_refund'?amount:null,p_resolution:v.resolution,p_reason:v.reason});
      note(r&&r.refund>0?'Case resolved. Refund of '+money(r.refund)+' queued.':'Case resolved. The stall\'s payment is released.');
      load('support');
    }catch(err){note('Could not resolve the case: '+String(err?.message||err),true)}
  }

    const open=x=>String(x.approval_status).toLowerCase()!=='removed';
    app.innerHTML='<div class="grid"><div class="panel"><h3>Vendor approvals</h3>'+table(v.filter(open),[{label:'Business',key:'business_name'},{label:'TID',key:'tonninyira_id'},{label:'Standing',render:x=>pill(x.approval_status),csv:x=>x.approval_status},{label:'Decision',noCsv:true,noSearch:true,render:x=>partnerActions('vendor',x)}],{name:'vendor-approvals',status:x=>x.approval_status})+'</div><div class="panel"><h3>Rider approvals</h3>'+table(r.filter(open),[{label:'Name',key:'full_name'},{label:'TID',key:'tonninyira_id'},{label:'Standing',render:x=>pill(x.approval_status),csv:x=>x.approval_status},{label:'Decision',noCsv:true,noSearch:true,render:x=>partnerActions('rider',x)}],{name:'rider-approvals',status:x=>x.approval_status})+'</div></div><div class="panel" style="margin-top:10px"><h3>Reviews</h3>'+table(rev.slice(-250).reverse(),[{label:'Rating',key:'rating'},{label:'Comment',key:'comment'},{label:'Created',render:x=>esc(when(x.created_at)),csv:x=>x.created_at}],{name:'reviews'})+'</div>'}

  async function growth(){setHead('Growth & analytics','Demand, customer activity and marketplace movement.');const [o,p,e]=await Promise.all([rows('orders'),rows('profiles','id,role,created_at'),rows('market_events')]);const paid=o.filter(x=>x.payment_status==='paid');const days={};paid.forEach(x=>{const d=String(x.created_at||'').slice(0,10)||'Unknown';(days[d]||=new Set()).add(x.order_id)});const series=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);app.innerHTML='<div class="grid"><div class="panel"><h3>Paid orders by day</h3>'+table(series.map(x=>({day:x[0],orders:x[1].size})),[{label:'Date',key:'day'},{label:'Paid orders',key:'orders'}],{name:'orders-by-day'})+'</div><div class="panel"><h3>Audience & activity</h3>'+table([{m:'Customers',n:p.filter(x=>x.role==='customer').length},{m:'Paid orders',n:new Set(paid.map(x=>x.order_id)).size},{m:'Completed orders',n:new Set(o.filter(x=>String(x.status).toLowerCase()==='completed').map(x=>x.order_id)).size},{m:'Marketplace events',n:e.length}],[{label:'Metric',key:'m'},{label:'Value',key:'n'}],{name:'activity'})+'</div></div>'}

  async function system(){setHead('System data','Audit log, operational records and configuration.');const [usage,audit,events,guides]=await Promise.all([rpc('admin_media_usage',{}).catch(()=>null),client().from('admin_actions').select('*').order('created_at',{ascending:false}).limit(1000).then(r=>{if(r.error)throw r.error;return r.data||[]}),rows('market_events'),rows('admin_guides','slug,title,updated_at')]);
    const label=a=>String(a||'').replace(/_/g,' ');
    const mb=n=>(Number(n||0)/1048576).toFixed(1)+' MB',pct=usage?Math.min(100,Math.round(usage.used_bytes/usage.limit_bytes*100)):0;
    const meterHTML=usage?'<div class="panel" style="margin-bottom:10px"><h3>Photo & video storage (free plan)</h3><div style="height:12px;border-radius:99px;background:var(--card2);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=80?'var(--red)':'var(--gold)')+'"></div></div><p style="margin:8px 0;font-size:12px">'+mb(usage.used_bytes)+' of 1 GB used ('+pct+'%) · '+usage.files+' files · '+usage.videos+' videos'+(pct>=80?' — <b>nearly full: time to move videos to paid hosting</b>':'')+'</p>'+(usage.by_user&&usage.by_user.length?'<p class="muted" style="margin:0;font-size:11px">Largest: '+usage.by_user.map(u=>esc(u.stall||('account '+String(u.user_id).slice(0,8)))+' '+mb(u.bytes)).join(' · ')+'</p>':'')+'<p class="muted" style="margin:6px 0 0;font-size:11px">Viewing is also limited on the free plan (about 5 GB a month). Supabase dashboard → Usage shows it.</p></div>':'';
    app.innerHTML=meterHTML+'<div class="panel"><h3>Audit log — every admin action</h3>'+table(audit,[{label:'When',render:x=>esc(when(x.created_at)),csv:x=>x.created_at},{label:'Action',render:x=>esc(label(x.action)),csv:x=>x.action},{label:'Target',render:x=>esc(x.target_type+' '+x.target_id),csv:x=>x.target_type+' '+x.target_id},{label:'Reason',key:'reason'},{label:'Admin',render:x=>'<span class="muted">'+esc(String(x.admin_user_id||'').slice(0,8))+'</span>',csv:x=>x.admin_user_id},{label:'Detail',render:x=>x.after?'<span class="muted">'+esc(JSON.stringify(x.after).slice(0,90))+'</span>':'—',csv:x=>JSON.stringify({before:x.before,after:x.after})}],{name:'audit-log',status:x=>label(x.action)})+'</div><div class="grid"><div class="panel"><h3>Recent events</h3>'+table(events.slice(-200).reverse(),[{label:'Type',key:'event_type'},{label:'Status',key:'status'},{label:'Reference',key:'reference'},{label:'Created',render:x=>esc(when(x.created_at)),csv:x=>x.created_at}],{name:'events'})+'</div><div class="panel"><h3>Protected guides</h3>'+table(guides,[{label:'Slug',key:'slug'},{label:'Title',key:'title'},{label:'Updated',render:x=>esc(when(x.updated_at)),csv:x=>x.updated_at}],{name:'guides'})+'</div></div>'}

  /* The August partner rows carry only a phone number, and no account shares
     it, so nothing can match them automatically. An admin picks the owner.
     Setting auth_user_id also stamps the row's email, via a database trigger. */
  async function linkAccount(kind,id){
    const r=await client().rpc('admin_list_accounts');
    if(r.error)throw r.error;
    const accts=r.data||[];
    if(!accts.length)throw Error('No accounts available to link.');
    const pick=await ask({title:'Link '+kind+' '+id,message:'Choose the Tonninyira account that owns this '+kind+'. They will sign in with its email and password.',fields:[{name:'user',label:'Account',type:'select',options:accts.map(a=>({value:a.user_id,label:(a.email||a.user_id)+(a.display_name?' — '+a.display_name:'')+' ('+a.role+')'}))}],confirm:'Link'});
    if(!pick)return false;
    const u=await client().from(kind==='vendor'?'vendors':'riders').update({auth_user_id:pick.user}).eq('tonninyira_id',id);
    if(u.error)throw u.error;
    return true;
  }


  /* Review a stall's logo, photos, videos and product photos; remove any of
     them (admin_remove_vendor_media, audited). The file itself is deleted
     from storage too, so it stops counting against the 1 GB free plan. */
  const MEDIA_PREFIX='https://alxzmjgepftohwpqibmn.supabase.co/storage/v1/object/public/tonninyira-media/';
  async function mediaDialog(id){
    const r=await client().from('vendors').select('tonninyira_id,business_name,logo_url,gallery,items').eq('tonninyira_id',id).maybeSingle();
    if(r.error)throw r.error;if(!r.data)throw Error('Stall not found.');
    const v=r.data,list=[];
    if(v.logo_url)list.push({url:v.logo_url,thumb:v.logo_url,label:'Logo'});
    (v.gallery||[]).forEach((g,i)=>list.push({url:g.url,thumb:g.type==='video'?(g.poster||''):g.url,label:g.type==='video'?'Video'+(g.duration?' · '+Math.floor(g.duration/60)+':'+String(g.duration%60).padStart(2,'0'):''):'Stall photo '+(i+1)}));
    (v.items||[]).forEach(it=>(it.photos||[]).forEach((u,i)=>list.push({url:u,thumb:u,label:it.name+' · photo '+(i+1)})));
    const m=document.createElement('div');m.className='dlg-back';
    m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="Media of '+esc(v.business_name)+'" style="max-width:760px;width:calc(100% - 24px)"><h3>'+esc(v.business_name)+' — photos and videos</h3>'
      +(list.length?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:60vh;overflow:auto">'+list.map((x,i)=>'<div style="background:var(--card2);border-radius:12px;overflow:hidden"><a href="'+esc(x.url)+'" target="_blank" rel="noopener" style="display:block;aspect-ratio:4/3;background:#3A2C22 center/cover no-repeat;background-image:url(\''+esc(x.thumb)+'\')" aria-label="Open '+esc(x.label)+'"></a><div style="padding:8px;font-size:11px"><div style="overflow-wrap:anywhere">'+esc(x.label)+'</div><button type="button" class="act stop" data-mi="'+i+'" style="margin-top:6px">Remove</button></div></div>').join('')+'</div>':'<p>No photos or videos yet.</p>')
      +'<div class="dlg-row"><button type="button" class="dlg-no">Close</button></div></div>';
    document.body.appendChild(m);
    return new Promise(resolve=>{
      const done=v=>{m.remove();resolve(v)};
      m.querySelector('.dlg-no').onclick=()=>done(false);
      m.onclick=async e=>{
        if(e.target===m)return done(false);
        const b=e.target.closest('[data-mi]');if(!b)return;
        const x=list[Number(b.dataset.mi)];
        m.style.display='none';
        const a=await ask({title:'Remove '+x.label,message:'It disappears from the stall straight away and the file is deleted.',fields:[reasonField],confirm:'Remove',danger:true});
        if(!a){m.style.display='';return}
        try{
          const res=await rpc('admin_remove_vendor_media',{p_vendor:id,p_url:x.url,p_reason:a.reason});
          const paths=[x.url,res?.poster].filter(u=>u&&u.startsWith(MEDIA_PREFIX)).map(u=>u.slice(MEDIA_PREFIX.length));
          if(paths.length)await client().storage.from('tonninyira-media').remove(paths);
          done(x.label+' removed from '+v.business_name+'.');
        }catch(err){m.style.display='';note('Could not remove: '+String(err?.message||err),true)}
      };
    });
  }
  async function approvedRiders(){const r=await client().from('riders').select('tonninyira_id,full_name,vehicle_type').eq('approval_status','approved').order('full_name');if(r.error)throw r.error;return r.data||[]}

  const ACTIONS={
    'goto':async b=>{nav.querySelector('[data-view="'+b.dataset.view+'"]')?.click();return false},
    'p-approve':async b=>{const v=await ask({title:(b.textContent==='Reactivate'?'Reactivate ':'Approve ')+b.dataset.kind+' '+b.dataset.id,message:'They will appear to customers'+(b.dataset.kind==='rider'?' and receive delivery offers':'')+' straight away.',fields:[{name:'reason',label:'Note (optional)',type:'textarea'}],confirm:b.textContent});if(!v)return false;await rpc('admin_set_partner_status',{p_kind:b.dataset.kind,p_id:b.dataset.id,p_status:'approved',p_reason:v.reason||null});return b.dataset.kind+' '+b.dataset.id+' is approved.'},
    'p-reject':async b=>{const v=await ask({title:'Reject '+b.dataset.kind+' '+b.dataset.id,fields:[reasonField],confirm:'Reject',danger:true});if(!v)return false;await rpc('admin_set_partner_status',{p_kind:b.dataset.kind,p_id:b.dataset.id,p_status:'rejected',p_reason:v.reason});return b.dataset.id+' was rejected.'},
    'p-suspend':async b=>{const v=await ask({title:'Suspend '+b.dataset.kind+' '+b.dataset.id,message:'They disappear from the storefront'+(b.dataset.kind==='rider'?' and stop receiving delivery offers':'')+' until you reactivate them. Nothing is deleted.',fields:[reasonField],confirm:'Suspend',danger:true});if(!v)return false;await rpc('admin_set_partner_status',{p_kind:b.dataset.kind,p_id:b.dataset.id,p_status:'suspended',p_reason:v.reason});return b.dataset.id+' is suspended.'},
    'p-remove':async b=>{const v=await ask({title:'Remove '+b.dataset.kind+' '+b.dataset.id,message:'If they have no orders or payments they are deleted. Otherwise they are archived: hidden everywhere and unlinked from their login, with their history kept.',fields:[reasonField],confirm:'Remove',danger:true});if(!v)return false;const r=await rpc('admin_remove_partner',{p_kind:b.dataset.kind,p_id:b.dataset.id,p_reason:v.reason});return b.dataset.id+(r?.outcome==='deleted'?' was deleted.':' was archived ('+r?.history_records+' history records kept).')},
    'p-media':async b=>mediaDialog(b.dataset.id),
    'p-link':async b=>{const ok=await linkAccount(b.dataset.kind,b.dataset.id);return ok?b.dataset.id+' is linked.':false},
    'o-cancel':async b=>{const v=await ask({title:'Cancel order '+b.dataset.id,message:b.dataset.paid?'This order is PAID. Cancelling does not refund the customer automatically — the audit log will mark it "refund due" so you can refund them by Mobile Money.':'The order is unpaid, so no refund is needed.',fields:[reasonField],confirm:'Cancel order',danger:true});if(!v)return false;const r=await rpc('admin_cancel_order',{p_order_id:b.dataset.id,p_reason:v.reason});return 'Order '+b.dataset.id+' cancelled.'+(r?.refund_due?' Refund due to the customer.':'')},
    'o-assign':async b=>{const riders=await approvedRiders();if(!riders.length)throw Error('There are no approved riders to assign.');const v=await ask({title:'Assign a rider to '+b.dataset.id,fields:[{name:'rider',label:'Rider',type:'select',options:riders.map(x=>({value:x.tonninyira_id,label:x.full_name+' · '+x.tonninyira_id+(x.vehicle_type?' · '+x.vehicle_type:'')}))},reasonField],confirm:'Assign'});if(!v)return false;await rpc('admin_reassign_rider',{p_order_id:b.dataset.id,p_rider_tid:v.rider,p_reason:v.reason});return v.rider+' is now delivering '+b.dataset.id+'. They have been alerted.'},
    'o-redispatch':async b=>{const v=await ask({title:'Re-dispatch '+b.dataset.id,message:'Clears the current rider and offers the delivery to approved riders within 20 km. If nobody accepts, a rider is assigned automatically.',fields:[reasonField],confirm:'Re-dispatch'});if(!v)return false;await rpc('admin_reassign_rider',{p_order_id:b.dataset.id,p_rider_tid:null,p_reason:v.reason});return b.dataset.id+' was re-offered to nearby riders.'},
    'po-paid':async b=>{const v=await ask({title:'Mark payout paid',message:'Only do this after the money has actually been sent.',fields:[{name:'ref',label:'Payment reference (MoMo or bank transaction ID)',required:true},{name:'reason',label:'Note (optional)',type:'textarea'}],confirm:'Mark paid'});if(!v)return false;await rpc('admin_set_payout_status',{p_payout_id:Number(b.dataset.id),p_status:'paid',p_reference:v.ref,p_reason:v.reason||null});return 'Payout marked paid.'},
    'po-failed':async b=>{const v=await ask({title:'Mark payout failed',message:'The amount goes back into the partner’s available balance.',fields:[reasonField],confirm:'Mark failed',danger:true});if(!v)return false;await rpc('admin_set_payout_status',{p_payout_id:Number(b.dataset.id),p_status:'failed',p_reference:null,p_reason:v.reason});return 'Payout marked failed.'},
    'c-suspend':async b=>{const v=await ask({title:'Suspend '+b.dataset.name,message:'They can still sign in and see past orders, but cannot place new orders until reactivated.',fields:[reasonField],confirm:'Suspend',danger:true});if(!v)return false;await rpc('admin_set_customer_suspended',{p_user_id:b.dataset.id,p_suspended:true,p_reason:v.reason});return b.dataset.name+' is suspended.'},
    'c-reactivate':async b=>{const v=await ask({title:'Reactivate '+b.dataset.name,fields:[reasonField],confirm:'Reactivate'});if(!v)return false;await rpc('admin_set_customer_suspended',{p_user_id:b.dataset.id,p_suspended:false,p_reason:v.reason});return b.dataset.name+' can order again.'}
  };
  /* Delegated, because every view rewrites app.innerHTML wholesale. */
  app.addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]');if(!b||!ACTIONS[b.dataset.act])return;
    const restore=b.textContent;b.disabled=true;
    try{
      const msg=await ACTIONS[b.dataset.act](b);
      if(msg===false){b.disabled=false;return}
      await load(current);
      note(msg);
    }catch(err){b.disabled=false;b.textContent=restore;note('Could not complete that: '+String(err?.message||err),true)}
  });

  app.addEventListener('click',async e=>{
    const b=e.target.closest('.tn-reply-send');
    if(!b)return;
    const input=app.querySelector('.tn-reply-input[data-convo="'+b.dataset.convo+'"]');
    const body=(input?.value||'').trim();
    if(!body)return;
    const me=(await client().auth.getUser())?.data?.user;
    if(!me){note('Your admin session has expired. Sign in again.',true);return}
    b.disabled=true;b.textContent='Sending…';
    const r=await client().from('support_messages').insert({conversation_id:b.dataset.convo,sender_user_id:me.id,body});
    b.disabled=false;b.textContent='Send';
    if(r.error){note('Could not send: '+r.error.message,true);return}
    if(input)input.value='';
    await load(current);
  });

  const V={overview,operations,customers,partners,finance,support,trust,growth,system};
  async function load(view){note('Loading '+view+'…');for(const k in TABLES)delete TABLES[k];app.innerHTML='<div class="empty">Loading…</div>';try{const s=await window.tnAdminState();if(!s.ok)throw Error(s.error||'Administrator access could not be verified');who.textContent=(s.display_name||s.user.email||'Admin')+' · '+s.role;await V[view]();note('Live data loaded.')}catch(e){note('This workspace remains open. '+String(e?.message||'Unable to load this view.'),true);app.innerHTML='<div class="error-box"><strong>'+esc(view)+'</strong><p>'+esc(e?.message||'Unable to load this view.')+'</p><p>Use Refresh after resolving the underlying data or permission issue.</p></div>'}}
  document.getElementById('refresh').addEventListener('click',()=>load(current));
  document.getElementById('signout').addEventListener('click',()=>window.tnAdminLogout?.());
  load(current);
})();
</script>
