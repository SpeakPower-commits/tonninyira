<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira — Reset admin password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--ink:#1C1410;--card:#2A1F19;--red:#E23F25;--gold:#F5B400;--sand:#F3E8D8;--muted:#9C897A}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--ink);color:var(--sand);font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:var(--card);border-radius:18px;padding:24px;border:1px solid rgba(243,232,216,.1)}h1{margin:4px 0 8px;font-size:25px}p{color:var(--muted);font-size:13px;line-height:1.5}label{display:block;margin-top:14px;font-size:12px;font-weight:700}input{width:100%;margin-top:6px;padding:13px;border-radius:10px;border:1px solid rgba(243,232,216,.14);background:#33261C;color:var(--sand);font:inherit}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--red);color:var(--sand);font-weight:800;cursor:pointer}.msg{min-height:20px;margin-top:10px;font-size:12px;color:#ffc2b8}.ok{color:#9de2a6}.back{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:12px;text-decoration:none}</style></head><body><main class="card"><div style="font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:900">TONNINYIRA</div><h1>Reset admin password</h1><p>Set a new password for the restricted administrator account. Your administrator name remains <strong>Admin</strong>.</p><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password"><label for="p2">Confirm new password</label><input id="p2" type="password" autocomplete="new-password"><button id="save">Set new password</button><div id="msg" class="msg"></div><a class="back" href="./index.html">Return to Tonninyira</a></main><script>const SUPABASE_URL='https://alxzmjgepftohwpqibmn.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_vLr2S8qLRHN5gVv9IITVPQ_CTXc4aCv';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const msg=document.getElementById('msg');document.getElementById('save').onclick=async()=>{const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8){msg.textContent='Use at least 8 characters.';return}if(p1!==p2){msg.textContent='The passwords do not match.';return}const {data:{user}}=await client.auth.getUser();if(!user){msg.textContent='Open this page from the password-reset email. The recovery session is missing.';return}const {error}=await client.auth.updateUser({password:p1});if(error){msg.textContent=error.message||'Could not update the password.';return}msg.className='msg ok';msg.textContent='Password updated. You can now sign in as Admin.';setTimeout(()=>location.href='./index.html',1200)};</script></body></html>
