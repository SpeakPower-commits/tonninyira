<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Tonninyira Works</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Standalone page, no Supabase dependency: this must work signed out and
  offline (see sw.js's SHELL list), the same way auth-callback.html and
  payment-return.html stand alone from the main app shell.

  Typography: Work Sans throughout, not the Plus Jakarta Sans / Bricolage
  Grotesque pairing used on the account-page redesign -- that pairing was
  chosen for stylistic distinctiveness aimed at Gen-Z university students,
  the opposite persona from this page's audience, where legibility matters
  more than flair. Icon style: Option A from the earlier style demo -- flat,
  high-contrast pictograms (dark stroke on a plain sand tile), chosen so
  nothing here is ambiguous at a glance.

  Language: content is looked up by step id out of I18N[lang], falling back
  to the English fields on the step object itself when a key is missing --
  so an incomplete or future translation degrades to English rather than to
  a blank screen. Confidence is NOT equal across the five languages offered:
  Luganda and Kiswahili are translated with real confidence (Kiswahili is
  one of Uganda's two official languages; Luganda is the dominant language
  around Kampala, where Tonninyira actually operates). Acholi is a Nilotic
  language, structurally unrelated to the other four, and Runyankole and
  Lumasaba (the language of the Bagisu -- Tom's own word for it was
  "Gishu") are Bantu but less deeply resourced here than Luganda. That
  difference is surfaced to the reader, not just noted in this comment --
  see #langNotice below -- because a wrong word in a legal or safety-facing
  sentence is a real harm to someone who by definition cannot check it
  against the English.
-->
<style>
  :root{--ink:#1C1410;--card:#2A1F19;--card2:#33261C;--gold:#F5B400;--sand:#F3E8D8;--muted:#9C897A;--safe2:#CBB9A6;--green:#4C9A5B}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--sand);font-family:'Work Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:460px;margin:0 auto;padding:20px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;justify-content:space-between}
  .mark{font-family:'Alfa Slab One',cursive;color:var(--gold);font-size:15px;letter-spacing:.01em}
  .back{font-size:13px;font-weight:600;color:var(--safe2);text-decoration:none}
  .back:hover{color:var(--sand)}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .lang-btn{font-family:inherit;font-size:11px;font-weight:700;color:var(--safe2);background:var(--card);border:1px solid transparent;border-radius:99px;padding:7px 11px;cursor:pointer;min-height:32px}
  .lang-btn.is-on{color:var(--ink);background:var(--gold);font-weight:800}
  .lang-notice{margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(245,180,0,.1);border:1px solid rgba(245,180,0,.35);font-size:11.5px;line-height:1.5;color:var(--safe2);display:none}
  .lang-notice.show{display:block}
  .tabs{display:flex;gap:6px;margin-top:16px;background:var(--card);border-radius:14px;padding:5px}
  .tab{flex:1;text-align:center;padding:11px 4px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);background:transparent;border:0;cursor:pointer;min-height:44px}
  .tab.is-on{font-weight:800;color:var(--ink);background:var(--gold)}
  .counter{text-align:center;margin-top:26px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--safe2)}
  .tile-row{display:flex;justify-content:center;margin-top:18px}
  .tile{width:124px;height:124px;border-radius:30px;background:var(--sand);display:flex;align-items:center;justify-content:center}
  .tile svg{width:60px;height:60px}
  .step-text{text-align:center;margin-top:20px}
  .caption{font-weight:800;font-size:26px;line-height:1.2}
  .detail{font-weight:400;font-size:15px;line-height:1.55;color:var(--safe2);margin-top:10px;padding:0 6px}
  .listen-row{display:flex;justify-content:center;margin-top:18px}
  .listen{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:22px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .listen:disabled{opacity:.45;cursor:default}
  .listen svg{width:18px;height:18px}
  .spacer{flex-grow:1;min-height:24px}
  .nav-row{display:flex;gap:12px}
  .btn{flex:1;min-height:48px;border-radius:16px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .btn-back{border:1px solid #3A302A;background:transparent;color:var(--sand)}
  .btn-back:disabled{opacity:.4;cursor:default}
  .btn-next{border:0;background:var(--gold);color:var(--ink)}
  .dots{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:16px}
  .dot{width:6px;height:6px;border-radius:99px;background:#5A4C40;border:0;padding:0;cursor:pointer;min-width:6px}
  .dot.is-on{width:18px;background:var(--gold)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  @media (max-width:380px){.caption{font-size:23px}.tile{width:104px;height:104px}.tile svg{width:50px;height:50px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="mark">TONNINYIRA</span>
    <a class="back" href="index.html">&larr; Back to app</a>
  </div>

  <h1 class="sr-only">How Tonninyira Works</h1>

  <div class="langs" id="langs" role="group" aria-label="Choose a language"></div>
  <div class="lang-notice" id="langNotice"></div>

  <div class="tabs" role="tablist" aria-label="Choose your role">
    <button class="tab" role="tab" id="tabShopper" data-role="shopper">Shopper</button>
    <button class="tab" role="tab" id="tabVendor" data-role="vendor">Stall Owner</button>
    <button class="tab" role="tab" id="tabRider" data-role="rider">Rider</button>
  </div>

  <div class="counter" id="counter"></div>

  <div class="tile-row"><div class="tile" id="tile"></div></div>

  <div class="step-text">
    <div class="caption" id="caption"></div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="listen-row">
    <button class="listen" id="listenBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>
      <span id="listenLabel">Listen</span>
    </button>
  </div>

  <div class="spacer"></div>

  <div class="nav-row">
    <button class="btn btn-back" id="backBtn" type="button">&larr; Back</button>
    <button class="btn btn-next" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="dots" id="dots" role="tablist" aria-label="Step"></div>

  <div class="sr-only" aria-live="polite" id="announce"></div>
</div>

<script>
'use strict';

/* Flat, high-contrast line icons -- copied verbatim from the sitewide

  user: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>',

/* One entry per step: {id, icon, caption, detail} in English -- the
   fallback for every language, and the only copy for a language until it
   gets an entry in I18N below. */
const GUIDE_DATA = {
  shopper: { label: 'Shopper', steps: [
    { id:'shopper-1', icon:'home', caption:'Open the app', detail:'Tonninyira opens on the Eats tab, showing stalls near your area — "Kisugu" to start.' },

    { id:'shopper-3', icon:'search', caption:'Browse or search', detail:'Look through Eats and Shop tabs and their categories, or search for what you want.' },
    { id:'shopper-4', icon:'star', caption:'Open a stall', detail:'Check its verification badge, ratings, and the items it sells.' },
    { id:'shopper-5', icon:'heart', caption:'Save it, or add to basket', detail:'Tap the heart to save a stall for later. Tap + on an item to add it to your basket.' },
    { id:'shopper-6', icon:'cart', caption:'Review your basket', detail:'The delivery fee is shown before you pay — no surprises.' },

    { id:'rider-5', icon:'hourglass', caption:'Status: pending', detail:'Your application is now in the review queue.' },
    { id:'rider-6', icon:'check', caption:'Get approved', detail:'An admin reviews your application.' },
    { id:'rider-7', icon:'user', caption:'Sign in to your Rider Dashboard', detail:'Same account email/phone and password — not the PIN.' },

};

/* Translations, looked up by step id. Confidence is not equal across these
   five: Luganda (lg) and Kiswahili (sw) are translated with real
   confidence. Acholi (ach) is a Nilotic language, structurally unrelated to
   the other four; Runyankole (nyn) and Lumasaba (myx, the Bagisu language)

   to the reader in #langNotice, not hidden. Proper nouns and institution
   names (Tonninyira, KCCA, URA, UNBS, PIN, National ID, Mobile Money, MTN,
   Airtel, boda-boda) are kept as-is in every language, matching how they
   are actually said in everyday Ugandan speech regardless of language. */

},

  'shopper-2': { caption:'Weka eneo lako la kuletewa', detail:'Andika eneo lako, au bonyeza kitufe cha mahali ili kutumia ulipo sasa.' },
  'shopper-3': { caption:'Tafuta au vinjari', detail:'Angalia vichupo vya Eats na Shop na aina zake, au tafuta unachotaka.' },
  'shopper-4': { caption:'Fungua duka', detail:'Angalia alama yake ya uthibitisho, tathmini, na bidhaa anazouza.' },

let role = 'shopper';
let stepIndex = 0;
const LANGS = [
  { code:'en', label:'English' },
  { code:'lg', label:'Luganda' },
  { code:'sw', label:'Kiswahili' },
  { code:'ach', label:'Acholi' },
  { code:'myx', label:'Lumasaba' },
  { code:'nyn', label:'Runyankole' }
];
const LOWER_CONFIDENCE = ['ach', 'myx', 'nyn'];
let gLang = 'en';
try{ const saved = localStorage.getItem('tn_lang'); if (LANGS.some(function(l){ return l.code === saved; })) gLang = saved; }catch(_){}

function stepText(step){
  const t = I18N[gLang] && I18N[gLang][step.id];
  return t || { caption: step.caption, detail: step.detail };
}

function speakStep(step){
  try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
  if (!('speechSynthesis' in window)){ return; }
  const t = stepText(step);
  const u = new SpeechSynthesisUtterance(t.detail ? (t.caption + '. ' + t.detail) : t.caption);
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

function renderLangs(){
  const wrap = document.getElementById('langs');
  wrap.innerHTML = LANGS.map(function(l){
    return '<button class="lang-btn' + (l.code === gLang ? ' is-on' : '') + '" data-lang="' + l.code + '">' + l.label + '</button>';
  }).join('');
  wrap.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      gLang = b.dataset.lang;
      try{ localStorage.setItem('tn_lang', gLang); }catch(_){}
      renderStep();
    });
  });
  const notice = document.getElementById('langNotice');
  if (gLang === 'en'){
    notice.classList.remove('show');
  } else {
    notice.classList.add('show');
    notice.textContent = LOWER_CONFIDENCE.indexOf(gLang) !== -1
      ? 'Machine-translated. English is the official text. This language has had less checking than Luganda or Kiswahili — if anything reads oddly, ask someone to help confirm it.'
      : 'Machine-translated. English is the official text.';
  }
}

function renderTabs(){
  document.querySelectorAll('.tab').forEach(function(btn){
    const isOn = btn.dataset.role === role;
    btn.classList.toggle('is-on', isOn);
    btn.setAttribute('aria-selected', isOn ? 'true' : 'false');
  });
}

function renderDots(){
  const steps = GUIDE_DATA[role].steps;
  const wrap = document.getElementById('dots');
  wrap.innerHTML = steps.map(function(s, i){
    return '<button class="dot' + (i === stepIndex ? ' is-on' : '') + '" role="tab" aria-label="Step ' + (i + 1) + ' of ' + steps.length + '" aria-selected="' + (i === stepIndex ? 'true' : 'false') + '" data-i="' + i + '"></button>';
  }).join('');
  wrap.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ stepIndex = Number(b.dataset.i); renderStep(); });
  });
}

function renderStep(){
  const steps = GUIDE_DATA[role].steps;
  if (stepIndex < 0) stepIndex = 0;
  if (stepIndex > steps.length - 1) stepIndex = steps.length - 1;
  const step = steps[stepIndex];
  const t = stepText(step);

  document.getElementById('counter').textContent = 'STEP ' + (stepIndex + 1) + ' OF ' + steps.length;
  document.getElementById('tile').innerHTML = GUIDE_ICON[step.icon] || '';
  document.getElementById('caption').textContent = t.caption;
  document.getElementById('detail').textContent = t.detail;
  document.getElementById('announce').textContent = t.caption + '. ' + t.detail;

  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  backBtn.disabled = stepIndex === 0;
  nextBtn.textContent = (stepIndex === steps.length - 1) ? 'Back to app →' : 'Next →';

  document.getElementById('listenBtn').onclick = function(){ speakStep(step); };
  document.getElementById('listenLabel').textContent = ('speechSynthesis' in window) ? 'Listen' : 'Listen (not supported here)';
  document.getElementById('listenBtn').disabled = !('speechSynthesis' in window);

  renderLangs();
  renderDots();
  renderTabs();
}

document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    role = btn.dataset.role;
    stepIndex = 0;
    renderStep();
  });
});

document.getElementById('backBtn').addEventListener('click', function(){
  if (stepIndex > 0){ stepIndex--; renderStep(); }
});

document.getElementById('nextBtn').addEventListener('click', function(){
  const steps = GUIDE_DATA[role].steps;
  if (stepIndex < steps.length - 1){ stepIndex++; renderStep(); }
  else { window.location.href = 'index.html'; }
});

renderStep();
</script>
