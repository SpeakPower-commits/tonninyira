<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms &amp; Conditions — Tonninyira</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Standalone page, no Supabase dependency: must be readable by anyone,
  signed in or not (see sw.js's SHELL list for offline availability).

  Layered notice pattern: every section shows a big icon plus a one-sentence
  plain-language summary as the large, primary element, with the fuller
  legal paragraph directly beneath it in smaller type -- always visible,
  never behind a click a low-literacy reader might not find.

  This is a genuine first draft grounded only in what the app actually
  does (the 5% platform commission already charged in
  partner-dashboard-auth-earnings.js, KCCA/URA/UNBS vendor compliance,
  National ID collection for riders, Cash on Delivery / Mobile Money via
  Flutterwave, Uganda's Data Protection and Privacy Act 2019, and the real
  approval_status mechanic). Anywhere a real policy doesn't exist yet in
  code -- an exact cancellation window, a data-controller contact -- the
  text says so inline rather than inventing a number. It is not legal
  advice and is not final: see the draft notice below.
-->
<style>
  :root{--ink:#1C1410;--card:#2A1F19;--card2:#33261C;--gold:#F5B400;--sand:#F3E8D8;--muted:#9C897A;--safe2:#CBB9A6;--red:#E23F25}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--sand);font-family:'Work Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:520px;margin:0 auto;padding:20px 20px 48px}
  .head{display:flex;align-items:center;justify-content:space-between}
  .title{font-weight:800;font-size:16px}
  .back{font-size:13px;font-weight:600;color:var(--safe2);text-decoration:none}
  .back:hover{color:var(--sand)}
  .draft{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(226,63,37,.14);border:1px solid var(--red);font-size:13px;font-weight:700;line-height:1.5}
  .jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
  .jump a{font-size:12px;font-weight:700;color:var(--safe2);background:var(--card);border-radius:99px;padding:7px 12px;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
  .jump a:hover{color:var(--sand)}
  section.t-sec{margin-top:30px;padding-top:22px;border-top:1px solid #332A24;scroll-margin-top:16px}
  section.t-sec:first-of-type{border-top:0}
  .icon-row{display:flex;align-items:center;gap:12px}
  .icon-tile{width:52px;height:52px;flex-shrink:0;border-radius:15px;background:var(--sand);display:flex;align-items:center;justify-content:center}
  .icon-tile svg{width:28px;height:28px}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
  .summary{font-weight:800;font-size:20px;line-height:1.32;margin-top:13px}
  .listen{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:20px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;margin-top:12px}
  .listen:disabled{opacity:.45;cursor:default}
  .listen svg{width:15px;height:15px}
  .full{font-weight:400;font-size:14.5px;line-height:1.62;color:var(--sand);margin-top:14px}
  .flag{color:#FFD9A0;font-weight:700}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="title">Terms &amp; Conditions</span>
    <a class="back" href="index.html">&larr; Back</a>
  </div>

  <div class="draft" id="draftNotice">&#9888; Draft for review &mdash; this is a working draft of Tonninyira&rsquo;s Terms &amp; Conditions. It is not yet final or legally binding. It should be reviewed and approved by Tonninyira and its legal advisor before being treated as the platform&rsquo;s official Terms.</div>

  <nav class="jump" aria-label="Jump to a section" id="jumpNav"></nav>

  <main id="sections"></main>
</div>

<script>
'use strict';

/* Same flat, high-contrast icon style as guide.html (Option A) -- dark
   stroke on a plain sand tile, chosen so nothing here is ambiguous at a
   glance. shield and scale are new; the rest are copied verbatim from the
   sitewide ICONS object in index.html. */
const TERMS_ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l9-7 9 7V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  sack: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9h10l-1 10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>',
  moto: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M5 18h9l3-6h3M14 12l-2-5H8l-2 5"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 6-3.5 9.5-8 11-4.5-1.5-8-5-8-11V5l8-3z"/><path d="M8.5 12l2.5 2.5 5-5"/></svg>',
  hourglass: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12"/><path d="M6 22h12"/><path d="M6 2c0 6 4 8 6 10-2 2-6 4-6 10"/><path d="M18 2c0 6-4 8-6 10 2 2 6 4 6 10"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="#1C1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M4 6h16"/><path d="M7 6l-3 6a3 3 0 0 0 6 0z"/><path d="M17 6l-3 6a3 3 0 0 0 6 0z"/><path d="M12 6v13"/><path d="M8 21h8"/></svg>'
};

/* Eight sections, grounded only in confirmed app mechanics. Anywhere a real
   policy doesn't exist yet in code, the full text names the gap ([Tom: ...])
   instead of inventing a number -- flagged spans are wrapped in class="flag"
   so they stand out for review. */
const TERMS_SECTIONS = [
  { id:'general', eyebrow:'GENERAL', icon:'home',
    summary:'Tonninyira connects shoppers, stall owners and riders — Tonninyira itself doesn’t sell or deliver anything directly.',
    full:'Tonninyira operates the platform that connects Customers with independent Vendors and independent Riders. Tonninyira is not a party to the sale contract between a Vendor and a Customer. Vendors are responsible for the quality, safety, legality and accuracy of what they list. Riders are responsible for safe, timely delivery conduct.' },
  { id:'shopper', eyebrow:'SHOPPER TERMS', icon:'cart',
    summary:'You choose what to order, pay by cash or mobile money, and can track it until it arrives.',
    full:'Placing an order creates a contract directly between you and the Vendor. The delivery fee is shown before you pay. Payment is by Cash on Delivery or Mobile Money (MTN or Airtel). <span class="flag">[Tom: confirm and state an exact cancellation policy here]</span> — as a general rule, contact support through the "Something wrong?" chat as early as possible; once a Vendor has begun preparing your order, cancellation may not be possible.' },
  { id:'vendor', eyebrow:'STALL OWNER TERMS', icon:'sack',
    summary:'Keep your licenses valid, your listings accurate, and Tonninyira keeps 5% of each sale as its service fee.',
    full:'You confirm that you hold a valid KCCA trading license and URA TIN (and a UNBS certificate, where it applies) that stay current while your stall is active. You are solely responsible for the accuracy of your prices, descriptions and availability, and for the safety and quality of what you sell. Tonninyira deducts a 5% service commission from your earnings on completed orders, shown in your Wallet &amp; payouts. You agree to fulfil accepted orders promptly and keep your stall information current.' },
  { id:'rider', eyebrow:'RIDER TERMS', icon:'moto',
    summary:'Ride safely, deliver honestly, and Tonninyira keeps 5% of your delivery earnings as its service fee.',
    full:'You confirm that your vehicle details and National ID are accurate. Your National ID is used only for internal verification and accountability — it is never shown to customers. You agree to accept only deliveries you can complete safely and promptly, and to mark deliveries accurately. Tonninyira deducts the same 5% service commission, tracked in your Wallet &amp; payouts.' },
  { id:'payments', eyebrow:'PAYMENTS', icon:'phone',
    summary:'Pay by cash when your order arrives, or by MTN/Airtel Mobile Money through Flutterwave.',
    full:'Two payment methods are offered at checkout: Cash on Delivery, or Mobile Money (MTN MoMo or Airtel Money) processed through Flutterwave, a licensed payment gateway. Tonninyira does not store your mobile money PIN or full card details.' },
  { id:'privacy', eyebrow:'DATA & PRIVACY', icon:'shield',
    summary:'We collect only what we need to run deliveries safely, and protect it under Uganda’s data protection law.',
    full:'Tonninyira collects phone numbers (account access, delivery coordination), location data (a Customer’s delivery area and a Rider’s live location while delivering, used to route orders and calculate distance-based fees), National ID numbers from Riders (internal verification only, never shown to Customers or Vendors), and Vendor compliance documents (KCCA license, URA TIN, UNBS certificate). This is processed in line with Uganda’s Data Protection and Privacy Act, 2019. Tonninyira does not sell personal data to third parties. <span class="flag">[Tom: add a data-controller contact here once available]</span>' },
  { id:'suspension', eyebrow:'SUSPENSION & TERMINATION', icon:'hourglass',
    summary:'Accounts that break these terms can be suspended or removed by Tonninyira at any time.',
    full:'Vendor and Rider applications go through an approval step — pending, approved, or rejected. Tonninyira may reject an application, or suspend or terminate an approved account, where information provided is false, documents are invalid or expired, or these Terms are broken. Customer access may be restricted for platform abuse.' },
  { id:'disputes', eyebrow:'DISPUTES & GOVERNING LAW', icon:'scale',
    summary:'These terms are governed by the laws of Uganda, and we’ll try to resolve disagreements directly first.',
    full:'These Terms are governed by the laws of the Republic of Uganda. Disputes should first be raised through the "Something wrong?" chat or Tonninyira support. Unresolved disputes are subject to the jurisdiction of the courts of Uganda.' }
];

const gLang = 'en'; /* no switcher built yet -- nothing to switch between until a translation exists */

function speakText(text){
  try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

const jumpNav = document.getElementById('jumpNav');
const sectionsHost = document.getElementById('sections');
const speechOk = ('speechSynthesis' in window);

jumpNav.innerHTML = TERMS_SECTIONS.map(function(s){
  return '<a href="#' + s.id + '">' + s.eyebrow.replace('&', '&amp;') + '</a>';
}).join('');

sectionsHost.innerHTML = TERMS_SECTIONS.map(function(s){
  return '' +
    '<section class="t-sec" id="' + s.id + '">' +
      '<div class="icon-row">' +
        '<div class="icon-tile" aria-hidden="true">' + (TERMS_ICON[s.icon] || '') + '</div>' +
        '<div class="eyebrow">' + s.eyebrow + '</div>' +
      '</div>' +
      '<div class="summary">' + s.summary + '</div>' +
      '<button class="listen" type="button" data-summary="' + encodeURIComponent(s.summary) + '"' + (speechOk ? '' : ' disabled') + '>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>' +
        (speechOk ? 'Listen' : 'Listen (not supported here)') +
      '</button>' +
      '<div class="full">' + s.full + '</div>' +
    '</section>';
}).join('');

/* Listen reads only the plain summary aloud, never the dense full text --
   the same rule the Guide follows: keep the audio short and useful. */
sectionsHost.querySelectorAll('.listen').forEach(function(btn){
  btn.addEventListener('click', function(){
    speakText(decodeURIComponent(btn.dataset.summary));
  });
});
</script>
</body>
</html>
