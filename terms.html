  legal paragraph directly beneath it in smaller type -- always visible,
  never behind a click a low-literacy reader might not find.

  does (the 5% platform commission already charged in
  partner-dashboard-auth-earnings.js, KCCA/URA/UNBS vendor compliance,
  National ID collection for riders, Cash on Delivery / Mobile Money via
  Flutterwave, Uganda's Data Protection and Privacy Act 2019, and the real
  approval_status mechanic). Anywhere a real policy doesn't exist yet in
  code -- an exact cancellation window, a data-controller contact -- the
  text says so inline, in every language, rather than inventing a number.
  It is not legal advice and is not final: see the draft notice below.

  Language: the picker and its choice (localStorage key tn_lang) are
  shared with guide.html, so picking a language on one page carries over
  to the other. Confidence is NOT equal across the five offered languages
  -- see the shared explanation in guide.html's header comment. It matters
  more here than there: a wrong word in "you agree to a 5% commission" or
  "your National ID stays private" is a real harm to someone who by
  definition cannot check it against the English.
-->

const LANGS = [
  { code:'en', label:'English' },
  { code:'lg', label:'Luganda' },
  { code:'sw', label:'Kiswahili' },
  { code:'ach', label:'Acholi' },
  { code:'myx', label:'Lumasaba' },
  { code:'nyn', label:'Runyankole' }
];
const LOWER_CONFIDENCE = ['ach', 'myx', 'nyn'];
let gLang = 'en';
try{ const saved = localStorage.getItem('tn_lang'); if (LANGS.some(function(l){ return l.code === saved; })) gLang = saved; }catch(_){}

function sectionText(sec){
  const t = I18N[gLang] && I18N[gLang][sec.id];
  return t || { summary: sec.summary, full: sec.full };
}

function speakText(text){
  try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

const jumpNav = document.getElementById('jumpNav');
const sectionsHost = document.getElementById('sections');
const speechOk = ('speechSynthesis' in window);

function renderLangs(){
  const wrap = document.getElementById('langs');
  wrap.innerHTML = LANGS.map(function(l){
    return '<button class="lang-btn' + (l.code === gLang ? ' is-on' : '') + '" data-lang="' + l.code + '">' + l.label + '</button>';
  }).join('');
  wrap.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      gLang = b.dataset.lang;
      try{ localStorage.setItem('tn_lang', gLang); }catch(_){}
      renderLangs();
      renderSections();
    });
  });
  const notice = document.getElementById('langNotice');
  if (gLang === 'en'){
    notice.classList.remove('show');
  } else {
    notice.classList.add('show');
    notice.textContent = LOWER_CONFIDENCE.indexOf(gLang) !== -1
      ? 'Machine-translated. English is the official text of this Terms page. This language has had less checking than Luganda or Kiswahili — please have a native speaker confirm it before relying on it.'
      : 'Machine-translated. English is the official text of this Terms page.';
  }
}

function renderSections(){
  jumpNav.innerHTML = TERMS_SECTIONS.map(function(s){
    return '<a href="#' + s.id + '">' + s.eyebrow.replace('&', '&amp;') + '</a>';
  }).join('');

  sectionsHost.innerHTML = TERMS_SECTIONS.map(function(s){
    const t = sectionText(s);
    return '' +
      '<section class="t-sec" id="' + s.id + '">' +
        '<div class="icon-row">' +
          '<div class="icon-tile" aria-hidden="true">' + (TERMS_ICON[s.icon] || '') + '</div>' +
          '<div class="eyebrow">' + s.eyebrow + '</div>' +
        '</div>' +
        '<div class="summary">' + t.summary + '</div>' +
        '<button class="listen" type="button" data-summary="' + encodeURIComponent(t.summary) + '"' + (speechOk ? '' : ' disabled') + '>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>' +
          (speechOk ? 'Listen' : 'Listen (not supported here)') +
        '</button>' +
        '<div class="full">' + t.full + '</div>' +
      '</section>';
  }).join('');

  /* Listen reads only the plain summary aloud, never the dense full text --
     the same rule the Guide follows: keep the audio short and useful. */
  sectionsHost.querySelectorAll('.listen').forEach(function(btn){
    btn.addEventListener('click', function(){
      speakText(decodeURIComponent(btn.dataset.summary));
    });
  });
}

renderLangs();
renderSections();
</script>
