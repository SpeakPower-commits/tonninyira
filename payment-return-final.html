<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f1712"><title>Payment — Tonninyira</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><style>body{margin:0;background:#1f1712;color:#f3e8d8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;min-height:100vh;place-items:center;padding:20px}.card{width:min(460px,100%);background:#2a1f19;border:1px solid rgba(243,232,216,.12);border-radius:22px;padding:24px;box-sizing:border-box;text-align:center}.brand{font-weight:900;letter-spacing:1.5px;color:#f5b400;font-size:.75rem}.status{margin:18px 0;font-size:1.05rem;font-weight:800}.muted{color:#b8aa9b;font-size:.83rem;line-height:1.5}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px;margin-top:10px;font-weight:900;text-decoration:none}.primary{background:#f5b400;color:#1f1712}.secondary{background:#3a2b23;color:#f3e8d8}.ok{font-size:2.5rem}</style></head><body><main class="card"><div class="brand">TONNINYIRA</div><div id="icon" class="ok">⏳</div><div id="status" class="status">Checking your payment…</div><div id="detail" class="muted">Please keep this page open for a moment.</div><div id="actions"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://alxzmjgepftohwpqibmn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFseHptamdlcGZ0b2h3cHFpYm1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTg1NDQsImV4cCI6MjEwMTU3NDU0NH0.YvFQhCqL6spINPsyLs7lf7z5wxtnfi4U893ydWLXEaA';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const q=new URLSearchParams(location.search),tx=q.get('tx_ref')||'',tid=q.get('transaction_id')||'',st=(q.get('status')||'').toLowerCase();
function finish(ok,msg,detail){document.getElementById('icon').textContent=ok?'✓':'!';document.getElementById('status').textContent=msg;document.getElementById('detail').textContent=detail;document.getElementById('actions').innerHTML='<a class="btn '+(ok?'primary':'secondary')+'" href="./index.html">Return to Tonninyira</a>'}
async function run(){if(!tx){finish(false,'Payment reference missing','Return to Tonninyira and check My Orders.');return}let n=0;const loop=async()=>{n++;try{const r=await client.functions.invoke('verify-flutterwave-payment',{body:{tx_ref:tx,transaction_id:tid||null}});if(!r.error&&r.data?.status==='paid'){try{sessionStorage.removeItem('tn_pending_payment')}catch(_){}finish(true,'Payment successful','Your Tonninyira order is now marked paid.');return}if(!r.error&&r.data?.status==='failed'){finish(false,'Payment not completed','Your order remains unpaid. You can return and try again.');return}}catch(_){}if(n<10)setTimeout(loop,2500);else finish(false,'Payment still processing','Do not pay again yet. Check My Orders shortly.');};loop()}
if(st==='cancelled'||st==='cancel')finish(false,'Payment cancelled','No successful payment was recorded.');else run();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
