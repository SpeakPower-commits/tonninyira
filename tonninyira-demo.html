<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonninyira — Customer to Vendor to Rider Demo</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#1c1410;color:#f3e8d8}header{padding:20px 18px;background:#2a1f19;position:sticky;top:0;z-index:10}.wrap{max-width:980px;margin:auto;padding:18px}h1{margin:0 0 6px}.muted{color:#bba99a;line-height:1.5}.section{background:#2a1f19;border-radius:16px;padding:16px;margin-top:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tab{flex:1;min-width:150px;padding:13px;border:1px solid #5a4637;background:#33261c;color:#f3e8d8;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{background:#f5b400;color:#1c1410}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#33261c;padding:12px;border-radius:11px}.metric small{display:block;color:#9c897a;margin-bottom:5px}.metric strong{font-size:1.1rem}.btn{padding:11px 14px;border:0;border-radius:10px;background:#e23f25;color:#f3e8d8;font-weight:800;cursor:pointer;margin-top:10px}.btn.secondary{background:#f5b400;color:#1c1410}.btn:disabled{opacity:.5}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#4c9a5b;margin:10px 0 0}.carousel{position:relative;overflow:hidden;border-radius:14px;height:270px;background:#33261c}.track{display:flex;height:100%;transition:transform .5s ease}.slide{min-width:100%;position:relative}.slide img{width:100%;height:100%;object-fit:cover;display:block}.cap{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.62);padding:8px 10px;border-radius:9px;font-weight:700;font-size:.84rem}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:40px;height:40px;background:rgba(0,0,0,.62);color:#fff;font-size:22px;cursor:pointer;z-index:3}.prev{left:10px}.next{right:10px}.dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.dots span.active{background:#f5b400}.stalls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.stall{background:#33261c;border-radius:14px;overflow:hidden;border:1px solid #4d3a2d}.stall img{width:100%;height:150px;object-fit:cover;display:block;background:#2a1f19}.stall .body{padding:13px}.tag{display:inline-block;font-size:.72rem;background:#f5b400;color:#1c1410;border-radius:999px;padding:4px 8px;font-weight:800}.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #4a392d}.price{font-weight:900;color:#f5b400}.cart{border-left:4px solid #f5b400}.checkout{background:#2a1f19;border:1px solid #5a4637;border-radius:14px;padding:14px;margin-top:12px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.step{padding:7px 9px;border-radius:999px;background:#33261c;color:#bba99a;font-size:.75rem;font-weight:700}.step.active{background:#4c9a5b;color:#fff}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #4a392d;padding:10px 0}.wallet{border-left:4px solid #f5b400}.notice{padding:10px;border-radius:11px;background:#33261c;color:#d9c8b8;margin-top:10px;font-size:.85rem}
</style></head><body><header><div class="wrap"><h1>Tonninyira Demo</h1><div class="muted">See the customer browse stalls, add an item, check out, then watch the same order reach the vendor and rider.</div></div></header><main class="wrap">
<section class="section"><h2 style="margin-top:0">1. Browse the market</h2><div class="carousel"><div class="track" id="track"></div><button class="arrow prev" onclick="move(-1)" aria-label="Previous image">‹</button><button class="arrow next" onclick="move(1)" aria-label="Next image">›</button><div class="dots" id="dots"></div></div><p class="muted">Only six known-good market photographs are used in the first view so the carousel stays light.</p></section>
<section class="section"><h2 style="margin-top:0">2. See real stall cards</h2><div class="stalls" id="stalls"></div></section>
<section class="section"><div class="tabs"><button class="tab active" data-role="customer">🛍 Customer</button><button class="tab" data-role="vendor">🏪 Vendor</button><button class="tab" data-role="rider">🏍 Rider</button></div><div id="app"></div></section>
</main><script>
const images=[1,2,3,4,5,6], stalls=[
{id:'sarah',name:'Mama Sarah Foods',location:'Kisugu',rating:'4.8',photo:2,items:[['Chicken & chips',10000],['Rolex',5000],['Katogo',7000]]},
{id:'fresh',name:'Kisugu Fresh Stall',location:'Kisugu Market',rating:'4.7',photo:4,items:[['Matoke bunch',8000],['Tomatoes 1kg',3500],['Avocado 3pcs',3000]]},
{id:'mivumba',name:'Kampala Smart Mivumba',location:'Kabalagala',rating:'4.6',photo:6,items:[['Shirt',12000],['Jeans',18000],['Dress',15000]]}];
const cart={stall:'sarah',item:'Chicken & chips',price:10000,qty:1,delivery:2500,status:'Browsing',payoutRequested:false};
function money(n){return'UGX '+Math.round(n).toLocaleString()}
let slide=0;function buildSlides(){track.innerHTML=images.map((n,i)=>`<div class="slide"><img src="assets/market/${n}.jpg" alt="Tonninyira market view ${n}" loading="${i===0?'eager':'lazy'}" decoding="async"><div class="cap">Kampala market · image ${n}</div></div>`).join('');dots.innerHTML=images.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('');renderSlides()}function renderSlides(){track.style.transform=`translateX(-${slide*100}%)`;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===slide))}function move(n){slide=(slide+n+images.length)%images.length;renderSlides()};buildSlides();setInterval(()=>move(1),6500);
function renderStalls(){stallsEl=document.getElementById('stalls');stallsEl.innerHTML=stalls.map(s=>`<article class="stall"><img src="assets/market/${s.photo}.jpg" alt="${s.name} stall view" loading="lazy" decoding="async"><div class="body"><span class="tag">${s.location}</span><h3 style="margin:9px 0 4px">${s.name}</h3><div class="muted">★ ${s.rating} · Local Tonninyira stall</div>${s.items.map(it=>`<div class="item"><div><strong>${it[0]}</strong><div class="muted">From this stall</div></div><div><div class="price">${money(it[1])}</div><button class="btn secondary" style="margin-top:6px;padding:8px 10px" onclick="chooseItem('${s.id}','${it[0]}',${it[1]})">Add</button></div></div>`).join('')}<div class="notice">Delivery estimate: ${money(cart.delivery)} · Account required only when placing the order.</div></div></article>`).join('')}function chooseItem(stall,item,price){cart.stall=stall;cart.item=item;cart.price=price;cart.qty=1;cart.status='Item selected';render('customer');window.scrollTo({top:document.getElementById('app').offsetTop-20,behavior:'smooth'})}
function render(role){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.role===role));const stall=stalls.find(s=>s.id===cart.stall)||stalls[0];const subtotal=cart.price*cart.qty,total=subtotal+cart.delivery,fee=subtotal*.05,vendorNet=subtotal-fee,riderFee=cart.delivery*.05,riderNet=cart.delivery-riderFee;let html='';
if(role==='customer'){html=`<div class="section"><h2>Customer: Amina</h2><div class="muted">She can browse the stalls first. No account is needed just to look around.</div><div class="checkout"><div class="grid"><div class="metric"><small>Selected stall</small><strong>${stall.name}</strong></div><div class="metric"><small>Selected item</small><strong>${cart.item}</strong></div><div class="metric"><small>Item price</small><strong>${money(subtotal)}</strong></div><div class="metric"><small>Delivery</small><strong>${money(cart.delivery)}</strong></div><div class="metric"><small>Total to pay</small><strong>${money(total)}</strong></div><div class="metric"><small>Payment</small><strong>Cash / MoMo / Airtel</strong></div></div><button class="btn secondary" onclick="placeOrder()">Place Order</button><span class="pill">${cart.status}</span><div class="notice">Demo sign-in point: when Amina presses Place Order, Tonninyira asks her to create/sign in to her account before the transaction is sent.</div></div></div>`}
if(role==='vendor'){html=`<div class="section"><h2>Vendor: ${stall.name}</h2><p class="muted">The vendor receives the order after customer checkout and sees the platform deduction.</p><div class="steps"><span class="step ${cart.status!=='Browsing'?'active':''}">Order received</span><span class="step ${['Ready for Pickup','Completed'].includes(cart.status)?'active':''}">Preparing</span><span class="step ${['Completed'].includes(cart.status)?'active':''}">Ready</span><span class="step ${cart.status==='Completed'?'active':''}">Completed</span></div><div class="grid"><div class="metric"><small>Gross sale</small><strong>${money(subtotal)}</strong></div><div class="metric"><small>Tonninyira 5%</small><strong>${money(fee)}</strong></div><div class="metric"><small>Vendor net</small><strong>${money(vendorNet)}</strong></div></div><button class="btn" onclick="setStatus('Ready for Pickup')">Mark Ready for Pickup</button><div class="wallet checkout"><h3>Vendor wallet</h3><div class="row"><span>Available after completion</span><strong>${money(cart.status==='Completed'?vendorNet:0)}</strong></div><div class="row"><span>Payout</span><strong>Mobile Money / Bank</strong></div><button class="btn secondary" onclick="demoWithdraw('Vendor',${vendorNet})">Withdraw</button></div></div>`}
if(role==='rider'){html=`<div class="section"><h2>Rider: Paul K.</h2><p class="muted">Once the vendor marks the order ready, the rider can pick it up and deliver it.</p><div class="grid"><div class="metric"><small>Delivery gross</small><strong>${money(cart.delivery)}</strong></div><div class="metric"><small>Tonninyira 5%</small><strong>${money(riderFee)}</strong></div><div class="metric"><small>Rider net</small><strong>${money(riderNet)}</strong></div></div><button class="btn" onclick="setStatus('Completed')">Complete Delivery</button><span class="pill">${cart.status}</span><div class="wallet checkout"><h3>Rider wallet</h3><div class="row"><span>Available after completion</span><strong>${money(cart.status==='Completed'?riderNet:0)}</strong></div><div class="row"><span>Payout</span><strong>Mobile Money / Bank</strong></div><button class="btn secondary" onclick="demoWithdraw('Rider',${riderNet})">Withdraw</button></div></div>`}document.getElementById('app').innerHTML=html}
function placeOrder(){if(cart.status==='Browsing'){chooseItem('sarah','Chicken & chips',10000);return}cart.status='Placed';alert('DEMO SIGN-IN GATE\n\nAmina must create/sign in to her Tonninyira account here. After verification, the order can be submitted.');render('customer')}
function setStatus(status){cart.status=status;render(document.querySelector('.tab.active').dataset.role)}
function demoWithdraw(role,amount){if(cart.status!=='Completed'){alert('Complete the demo transaction first.');return}alert(`${role} payout demo\n\nAmount: ${money(amount)}\nDestination: Mobile Money or Bank\nStatus: REQUESTED\n\nProduction uses the secured payout request record and a connected payment provider to actually move the money.`)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.role));renderStalls();render('customer');
</script></body></html>
